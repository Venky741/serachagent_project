<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Java Contract Jobs Viewer</title>
<style>
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --border: #e0e0e5; --text: #1c1c1f;
    --muted: #6b6b76; --accent: #3b5bdb; --accent-bg: #eef1fd; --hover: #f0f1f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16161a; --panel: #1e1e23; --border: #2c2c33; --text: #e8e8ec;
      --muted: #9a9aa5; --accent: #7c93f5; --accent-bg: #23273f; --hover: #26262e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--text); }
  header { padding: 16px 20px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .controls input[type=text], .controls select { padding:7px 10px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); font-size:13px; }
  .controls input[type=text] { min-width:220px; flex:1; }
  label.file-btn { padding:7px 14px; background:var(--accent); color:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  label.file-btn input { display:none; }
  .stats { color:var(--muted); font-size:12px; margin-top:8px; }
  .checkbox-lbl { font-size:13px; display:flex; align-items:center; gap:5px; color:var(--muted); }
  main { padding: 16px 20px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--border); border-radius:8px; overflow:hidden; }
  th, td { padding:9px 10px; border-bottom:1px solid var(--border); font-size:13px; text-align:left; vertical-align:top; }
  th { cursor:pointer; user-select:none; background:var(--hover); position:sticky; top:var(--header-height, 97px); white-space:nowrap; }
  th:hover { color:var(--accent); }
  tr:hover td { background:var(--hover); }
  tr.c2c td { background: var(--accent-bg); }
  .badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:600; }
  .badge.c2c { background:#ffe3e3; color:#c92a2a; }
  .badge.remote { background:#d3f9d8; color:#2b8a3e; }
  @media (prefers-color-scheme: dark) {
    .badge.c2c { background:#3a1f22; color:#ff8787; }
    .badge.remote { background:#1e3a24; color:#69db7c; }
  }
  a.jlink { color:var(--accent); text-decoration:none; }
  a.jlink:hover { text-decoration:underline; }
  .desc-btn { border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:5px; padding:3px 8px; cursor:pointer; font-size:12px; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }
  /* modal */
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; align-items:flex-start; justify-content:center; padding:5vh 20px; }
  .overlay.open { display:flex; }
  .modal { background:var(--panel); border-radius:10px; max-width:720px; width:100%; max-height:88vh; overflow:auto; padding:22px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .modal h2 { margin-top:0; font-size:17px; }
  .modal .meta { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .modal .body { white-space:pre-wrap; font-size:13px; line-height:1.5; }
  .modal .close { float:right; cursor:pointer; border:none; background:none; font-size:20px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Java Contract Jobs Viewer</h1>
  <div class="controls">
    <label class="file-btn">Load CSV<input type="file" id="fileInput" accept=".csv"></label>
    <span id="autoLoadStatus" style="font-size:12px; color:var(--muted)"></span>
    <input type="text" id="search" placeholder="Search title, company, location...">
    <select id="jobType"><option value="">All job types</option></select>
    <select id="site"><option value="">All sites</option></select>
    <label class="checkbox-lbl"><input type="checkbox" id="c2cOnly"> C2C only</label>
    <label class="checkbox-lbl"><input type="checkbox" id="emailOnly"> Has vendor email</label>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <table id="tbl" style="display:none">
    <thead><tr id="headRow"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="empty" id="emptyMsg">Load a CSV generated by java_contract_job_agent.py to get started.</div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="closeModal">&times;</button>
    <h2 id="mTitle"></h2>
    <div class="meta" id="mMeta"></div>
    <div class="body" id="mBody"></div>
  </div>
</div>

<script src="job_viewer_data.js" onerror="window.__JOB_VIEWER_DATA__ = null" onload="window.__JOB_VIEWER_LOADED__ = true"></script>
<script>
const COLUMNS = [
  { key: "title", label: "Title" },
  { key: "company", label: "Company" },
  { key: "location", label: "Location" },
  { key: "date_posted", label: "Posted" },
  { key: "job_type", label: "Type" },
  { key: "site", label: "Site" },
  { key: "flags", label: "Flags" },
  { key: "vendor_emails", label: "Vendor Email" },
  { key: "job_url", label: "Link" },
  { key: "description", label: "Description" },
];

let rows = [];
let sortKey = "date_posted";
let sortDir = -1;

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).filter(r => r.length === header.length && r.some(v => v !== "")).map(r => {
    const obj = {};
    header.forEach((h, idx) => obj[h] = r[idx] ?? "");
    return obj;
  });
}

function esc(s) {
  return (s ?? "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function populateFilters() {
  const types = [...new Set(rows.map(r => r.job_type).filter(Boolean))].sort();
  const sites = [...new Set(rows.map(r => r.site).filter(Boolean))].sort();
  const jt = document.getElementById("jobType");
  const st = document.getElementById("site");
  jt.innerHTML = '<option value="">All job types</option>' + types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
  st.innerHTML = '<option value="">All sites</option>' + sites.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
}

function buildHead() {
  const headRow = document.getElementById("headRow");
  headRow.innerHTML = COLUMNS.map(c => `<th data-key="${c.key}">${c.label}</th>`).join("");
  headRow.querySelectorAll("th").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
      render();
    });
  });
}

function truthy(v) {
  return v === true || v === "True" || v === "true" || v === "1";
}

function matchesFilters(r) {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const jt = document.getElementById("jobType").value;
  const site = document.getElementById("site").value;
  const c2cOnly = document.getElementById("c2cOnly").checked;
  const emailOnly = document.getElementById("emailOnly").checked;
  if (q) {
    const hay = `${r.title} ${r.company} ${r.location}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (jt && r.job_type !== jt) return false;
  if (site && r.site !== site) return false;
  if (c2cOnly && !truthy(r.c2c_mentioned)) return false;
  if (emailOnly && !(r.vendor_emails && r.vendor_emails.trim())) return false;
  return true;
}

function render() {
  const filtered = rows.filter(matchesFilters);
  filtered.sort((a, b) => {
    const av = a[sortKey] ?? "", bv = b[sortKey] ?? "";
    if (sortKey === "date_posted") return (new Date(av) - new Date(bv)) * sortDir;
    return av.toString().localeCompare(bv.toString()) * sortDir;
  });

  const body = document.getElementById("body");
  document.getElementById("tbl").style.display = rows.length ? "table" : "none";
  document.getElementById("emptyMsg").style.display = rows.length ? "none" : "block";
  document.getElementById("emptyMsg").textContent = rows.length && !filtered.length ? "No jobs match the current filters." : document.getElementById("emptyMsg").textContent;

  body.innerHTML = filtered.map((r, idx) => {
    const flags = [];
    if (truthy(r.c2c_mentioned)) flags.push('<span class="badge c2c">C2C</span>');
    if (truthy(r.is_remote)) flags.push('<span class="badge remote">Remote</span>');
    const desc = (r.description || "").trim();
    const preview = desc.length > 0 ? `<button class="desc-btn" data-idx="${idx}">View</button>` : "";
    return `<tr class="${truthy(r.c2c_mentioned) ? 'c2c' : ''}">
      <td>${esc(r.title)}</td>
      <td>${esc(r.company)}</td>
      <td>${esc(r.location)}</td>
      <td>${esc(r.date_posted)}</td>
      <td>${esc(r.job_type)}</td>
      <td>${esc(r.site)}</td>
      <td>${flags.join(" ")}</td>
      <td>${esc(r.vendor_emails)}</td>
      <td>${r.job_url ? `<a class="jlink" href="${esc(r.job_url)}" target="_blank" rel="noopener">Open</a>` : ""}</td>
      <td>${preview}</td>
    </tr>`;
  }).join("");

  document.getElementById("stats").textContent =
    `${filtered.length} of ${rows.length} jobs shown` +
    (rows.length ? ` · ${rows.filter(r => truthy(r.c2c_mentioned)).length} C2C-flagged · ${rows.filter(r => r.vendor_emails && r.vendor_emails.trim()).length} with vendor email` : "");

  body.querySelectorAll(".desc-btn").forEach(btn => {
    btn.addEventListener("click", () => openModal(filtered[+btn.dataset.idx]));
  });
}

function openModal(r) {
  document.getElementById("mTitle").textContent = r.title || "";
  document.getElementById("mMeta").textContent = `${r.company || ""} · ${r.location || ""} · ${r.date_posted || ""}`;
  document.getElementById("mBody").textContent = r.description || "";
  document.getElementById("overlay").classList.add("open");
}
document.getElementById("closeModal").addEventListener("click", () => document.getElementById("overlay").classList.remove("open"));
document.getElementById("overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") e.currentTarget.classList.remove("open"); });

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    rows = parseCSV(ev.target.result);
    populateFilters();
    render();
  };
  reader.readAsText(file);
});

["search", "jobType", "site", "c2cOnly", "emailOnly"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});

buildHead();

function tryAutoLoad() {
  const status = document.getElementById("autoLoadStatus");
  if (window.__JOB_VIEWER_DATA__ && Array.isArray(window.__JOB_VIEWER_DATA__.jobs)) {
    const data = window.__JOB_VIEWER_DATA__;
    rows = data.jobs.map(r => {
      const obj = {};
      Object.keys(r).forEach(k => obj[k] = r[k] == null ? "" : String(r[k]));
      return obj;
    });
    populateFilters();
    render();
    status.textContent = `Auto-loaded ${data.source_file || "latest run"} (generated ${new Date(data.generated_at).toLocaleString()})`;
  } else {
    status.textContent = "No auto-load data found yet — run the agent, or load a CSV manually.";
  }
}
// job_viewer_data.js loads as a classic script; give it a tick to attach before checking.
window.addEventListener("DOMContentLoaded", () => setTimeout(tryAutoLoad, 30));

// Keep the sticky table header pinned exactly below the controls bar,
// whatever its actual rendered height turns out to be.
function syncHeaderHeight() {
  const h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--header-height", h + "px");
}
window.addEventListener("load", syncHeaderHeight);
window.addEventListener("resize", syncHeaderHeight);

// Auto-refresh so an already-open tab picks up each new scheduled run
// without the user needing to reopen or manually reload the page.
const AUTO_REFRESH_MINUTES = 5;
let secondsLeft = AUTO_REFRESH_MINUTES * 60;
function tickRefreshCountdown() {
  secondsLeft -= 1;
  const status = document.getElementById("autoLoadStatus");
  if (status) {
    if (!status.dataset.base) status.dataset.base = status.textContent;
    if (secondsLeft > 0) {
      status.textContent = `${status.dataset.base} · refreshing in ${Math.ceil(secondsLeft / 60)}m`;
    }
  }
  if (secondsLeft <= 0) location.reload();
}
setInterval(tickRefreshCountdown, 1000);
</script>
</body>
</html>
